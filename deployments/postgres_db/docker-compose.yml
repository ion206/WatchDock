# Deliberately undersized for the WatchDock test: 256m cannot hold this workload.
services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=32MB", "-c", "max_connections=20"]
    shm_size: 256mb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdock -d app"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
